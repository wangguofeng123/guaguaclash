mixed-port: 10500
allow-lan: false
mode: rule
log-level: info

dns:
  enable: true
  enhanced-mode: fake-ip
  nameserver:
    - 223.5.5.5
    - 119.29.29.29

proxies: []
proxy-groups:
  - name: Proxy
    type: select
    proxies: []

  - name: Auto
    type: url-test
    proxies: []
    url: http://www.gstatic.com/generate_204
    interval: 300

rules:
  - GEOSITE,cn,DIRECT
  - MATCH,Proxy
